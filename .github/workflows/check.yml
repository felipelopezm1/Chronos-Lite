name: check
# Every push and every pull request, on every path: the runtime is most of this repository, so a path filter
# would skip the changes that matter most.
on:
  push:
  pull_request:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
