<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#05070b">
  <title>Chronos Lite</title>
  <link rel="icon" href="data:,">
  <!-- the service serves ui/ at /: every path here is from the root -->
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/views.css">
  <script>
    // the chosen mode before the first paint, so a light choice never flashes dark
    try { const m = localStorage.getItem("ui.mode"); if (m === "light" || m === "dark") document.documentElement.dataset.mode = m; } catch {}
  </script>
</head>
<body>
  <a class="skip" href="#view">skip to the view</a>

  <!-- the header: the brand, and what the service is doing -->
  <header class="top" id="top">
    <a class="brand" href="#/now">
      <span class="mark" id="mark" aria-hidden="true"></span>
      <h1 class="brand-name" id="brand-name">Chronos Lite</h1>
      <span class="tiny brand-commit" id="brand-version"></span>
    </a>
    <span class="top-rest"></span>
    <div class="facts">
      <span class="fact" id="top-card" title="the graphics card"><span class="dot dot-asleep" aria-hidden="true"></span><span class="k">card</span><b>—</b></span>
      <span class="fact" id="top-heat" title="the GPU junction"><span class="k">junction</span><b>—</b></span>
      <span class="fact" id="top-stream" role="status"><span class="dot dot-asleep" aria-hidden="true"></span><span class="sr">connecting to the event stream</span></span>
      <button type="button" class="tab-btn" id="mode" aria-label="colour mode"><span aria-hidden="true">◐</span></button>
    </div>
  </header>

  <!-- the stage: the backdrop under everything, the oracle dock, the view -->
  <main class="stage" id="stage">
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <aside class="dock" id="dock" aria-label="the face and what the service is doing"></aside>
    <section class="view" id="view" tabindex="-1" aria-label="the view">
      <div class="banner" id="banner" role="alert" hidden><span id="banner-text"></span><button type="button" class="btn small" id="banner-retry">try again now</button></div>
    </section>
    <p class="toast" id="toast" role="status" hidden></p>
  </main>

  <!-- the view bar: now · loom · record · models, and the built-on mark -->
  <nav class="viewbar" id="viewbar" aria-label="views"></nav>

  <script type="module" src="/app.js"></script>
</body>
</html>
