<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f766e">
  <title>Agents</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
  <script>
    // the chosen mode before the first paint, so a dark choice never flashes light
    try { const m = localStorage.getItem("ui.mode"); if (m === "light" || m === "dark") document.documentElement.dataset.mode = m; } catch {}
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#ask-text">Skip to the ask box</a>
  <header class="bar">
    <div class="brand">
      <span class="mark" id="mark" aria-hidden="true"></span>
      <span class="brand-name" id="brand-name">Agents</span>
    </div>
    <div class="bar-status">
      <span class="health" id="health" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span class="health-text">Connecting</span>
      </span>
      <span class="card-state" id="card-state" hidden></span>
      <button class="icon-btn" id="mode" type="button" aria-label="Colour mode: follows the system"><span aria-hidden="true">◐</span></button>
    </div>
  </header>

  <div class="banner" id="banner" role="alert" hidden>
    <span id="banner-text"></span>
    <button class="btn btn-quiet" id="banner-retry" type="button">Try again now</button>
  </div>

  <main class="layout" id="layout">
    <section class="col col-side" aria-label="Ask and tasks">
      <form class="panel ask" id="ask" novalidate>
        <label class="ask-label" for="ask-text" id="ask-label">What should the agents do?</label>
        <textarea id="ask-text" name="task" rows="4" required placeholder="Describe the task in plain words." aria-describedby="ask-hint ask-error"></textarea>
        <fieldset class="sizes">
          <legend class="sr-only">How thorough</legend>
          <label class="seg"><input type="radio" name="size" value="auto" checked><span data-word="auto">Auto</span></label>
          <label class="seg"><input type="radio" name="size" value="s"><span data-word="quick">Quick</span></label>
          <label class="seg"><input type="radio" name="size" value="m"><span data-word="thorough">Thorough</span></label>
        </fieldset>
        <p class="hint" id="ask-hint"></p>
        <p class="error" id="ask-error" role="alert" hidden></p>
        <div class="ask-row">
          <span class="kbd-hint" aria-hidden="true">Ctrl + Enter to send</span>
          <button class="btn btn-primary" id="send" type="submit">Send</button>
        </div>
      </form>

      <section class="panel list-panel" aria-labelledby="tasks-title">
        <h2 class="panel-title" id="tasks-title">Tasks</h2>
        <ul class="tasks" id="tasks" aria-busy="true"></ul>
      </section>

      <section class="panel models" aria-labelledby="models-title">
        <h2 class="panel-title" id="models-title">Models</h2>
        <ul class="model-list" id="models"></ul>
      </section>
    </section>

    <section class="col col-main panel detail" id="detail" aria-label="Task detail" tabindex="-1"></section>
  </main>

  <footer class="foot">
    <span class="built" id="built-on">built on Chronos</span>
    <span class="foot-sep" aria-hidden="true">·</span>
    <span id="version"></span>
  </footer>
</body>
</html>
